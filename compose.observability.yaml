services:
  gateway:
    build: .
    environment:
      AGENT_GATEWAY_ALLOWED_PROVIDER_MODELS: echo:local-test
      AGENT_GATEWAY_API_KEYS: demo-token
      AGENT_GATEWAY_MAX_INPUT_TOKENS: "16"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: agent-gateway
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docs/observability/collector/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./docs/observability/local-demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/observability/alerts/prometheus-rules.yaml:/etc/prometheus/rules/agent-gateway.yaml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docs/observability/local-demo/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docs/observability/local-demo/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docs/observability/dashboards/grafana-agent-gateway.json:/var/lib/grafana/dashboards/agent-gateway.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
